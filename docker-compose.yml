services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uptime_monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d uptime_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
