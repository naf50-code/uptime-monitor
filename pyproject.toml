[project]
name = "uptime-monitor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.0.55",
    "asyncpg==0.31.0",
    "alembic==1.16.1",
    "python-dotenv==1.1.0",
    "pwdlib[argon2]==0.3.1",
    "PyJWT==2.15.1",
    "email-validator==2.3.0",
    "httpx==0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
