name: CI and monitoring

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t uptime-monitor:${{ github.sha }} .

  scheduled-checks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger due monitor checks
        env:
          MONITOR_API_URL: ${{ secrets.MONITOR_API_URL }}
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: |
          if [ -z "$MONITOR_API_URL" ] || [ -z "$SCHEDULER_TOKEN" ]; then
            echo "::notice::Set MONITOR_API_URL and SCHEDULER_TOKEN secrets to enable scheduled checks."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 180 \
            -X POST "${MONITOR_API_URL%/}/internal/run-due-checks" \
            -H "Authorization: Bearer $SCHEDULER_TOKEN"
